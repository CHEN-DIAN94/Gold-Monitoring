name: 每日行情早报

on:
  schedule:
    # 每天早上8点（UTC时间0点 = 北京时间8点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  report:
    name: 发送早报
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 发送每日行情早报
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python 黄金监控.py --once
